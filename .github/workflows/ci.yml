name: CI Manual (Full Report)

on:
  pull_request:
    branches: [ "main" ]

permissions:
  pull-requests: write
  contents: read

# DEFINE O FUSO HORÁRIO GLOBALMENTE PARA TODO O WORKFLOW
env:
  TZ: 'America/Sao_Paulo'

jobs:
  report-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Importante: Baixa histórico completo para ver merges antigos
          fetch-depth: 0

      - name: Gerar Relatório Completo
        run: |
          chmod +x .github/scripts/generate_report.sh
          # Passa as variáveis necessárias
          ./.github/scripts/generate_report.sh > pr_message.md
          
          echo "=== Debug: Conteúdo Gerado ==="
          cat pr_message.md

      - name: Comentar no PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/comment.sh
          ./.github/scripts/comment.sh "${{ github.event.pull_request.number }}" "pr_message.md"
